<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Review Management | SP Engineering & Consultancy</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

 <style>

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f5f7fa;
    font-family: "Poppins", sans-serif;
    color: #222;
  }


  /* =========================
     ADMIN HEADER
     ========================= */

  .admin-header {
    background: #0f4c81;
    color: #ffffff;
    padding: 18px 30px;
  }

  .admin-header-inner {
    max-width: 1400px;
    margin: 0 auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;
  }

  .admin-brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .admin-logo {
    width: 48px;
    height: 48px;

    background: #ffffff;
    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    flex-shrink: 0;
  }

  .admin-logo img {
    width: 100%;
    height: 100%;

    object-fit: contain;
    display: block;
  }

  .admin-header h1 {
    margin: 0;

    font-size: 21px;
    font-weight: 600;

    line-height: 1.3;
  }

  .admin-header p {
    margin: 3px 0 0;

    opacity: 0.82;

    font-size: 12px;
  }


  /* =========================
     LOGOUT
     ========================= */

  .logout-btn {
    background: #ffffff;
    color: #0f4c81;

    border: none;

    padding: 10px 18px;

    border-radius: 6px;

    font-family: inherit;
    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition:
      background 0.2s ease,
      transform 0.2s ease;
  }

  .logout-btn:hover {
    background: #f1f4f7;

    transform: translateY(-1px);
  }


  /* =========================
     MAIN CONTAINER
     ========================= */

  .admin-container {
    max-width: 1400px;

    margin: 35px auto;

    padding: 0 25px;
  }


  /* =========================
     PAGE INTRO
     ========================= */

  .dashboard-intro {
    margin-bottom: 25px;
  }

  .dashboard-intro h2 {
    margin: 0;

    color: #1d2b36;

    font-size: 24px;
    font-weight: 600;
  }

  .dashboard-intro p {
    margin: 6px 0 0;

    color: #777;

    font-size: 13px;
  }


  /* =========================
     STATISTICS
     ========================= */

  .stats-grid {
    display: grid;

    grid-template-columns:
      repeat(3, 1fr);

    gap: 18px;

    margin-bottom: 28px;
  }

  .stat-card {
    background: #ffffff;

    border: 1px solid #e5e9ee;

    border-radius: 10px;

    padding: 22px;

    box-shadow:
      0 4px 15px rgba(0, 0, 0, 0.04);

    position: relative;

    overflow: hidden;
  }

  .stat-card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 4px;

    background: #0f4c81;
  }

  .stat-card.pending::before {
    background: #d89b00;
  }

  .stat-card.approved::before {
    background: #198754;
  }

  .stat-card.rejected::before {
    background: #dc3545;
  }

  .stat-card h3 {
    margin: 0 0 8px;

    color: #707880;

    font-size: 13px;
    font-weight: 500;
  }

  .stat-number {
    color: #1d2b36;

    font-size: 30px;
    font-weight: 700;

    line-height: 1;
  }


  /* =========================
     REVIEWS SECTION
     ========================= */

  .reviews-section {
    background: #ffffff;

    border: 1px solid #e5e9ee;

    border-radius: 10px;

    padding: 28px;

    box-shadow:
      0 4px 15px rgba(0, 0, 0, 0.04);
  }

  .reviews-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;

    margin-bottom: 22px;
  }

  .reviews-header h2 {
    margin: 0;

    color: #1d2b36;

    font-size: 19px;
    font-weight: 600;
  }


  /* =========================
     REVIEW FILTERS
     ========================= */

  .review-filters {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
  }

  .filter-btn {
    border: 1px solid #dce2e8;

    background: #ffffff;

    color: #59636d;

    padding: 8px 14px;

    border-radius: 6px;

    font-family: inherit;

    font-size: 12px;
    font-weight: 500;

    cursor: pointer;

    transition:
      background 0.2s ease,
      color 0.2s ease,
      border-color 0.2s ease;
  }

  .filter-btn:hover {
    border-color: #0f4c81;

    color: #0f4c81;
  }

  .filter-btn.active {
    background: #0f4c81;

    border-color: #0f4c81;

    color: #ffffff;
  }


  /* =========================
     REVIEW LIST
     ========================= */

  .review-list {
    display: flex;

    flex-direction: column;

    gap: 14px;
  }


  /* =========================
     REVIEW CARD
     ========================= */

  .admin-review-card {
    background: #ffffff;

    border: 1px solid #e3e8ed;

    border-radius: 8px;

    padding: 20px;

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .admin-review-card:hover {
    border-color: #cbd5df;

    box-shadow:
      0 4px 14px rgba(0, 0, 0, 0.04);
  }

  .review-card-top {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    gap: 20px;
  }

  .review-name {
    color: #20272d;

    font-size: 16px;
    font-weight: 600;
  }

  .review-date {
    margin-top: 4px;

    color: #858d95;

    font-size: 11px;
  }

  .review-stars {
    color: #d89b00;

    font-size: 17px;

    letter-spacing: 1px;

    white-space: nowrap;
  }

  .review-feedback {
    margin: 16px 0;

    color: #4d555d;

    font-size: 13px;

    line-height: 1.7;

    overflow-wrap: anywhere;

    word-break: break-word;
  }


  /* =========================
     STATUS
     ========================= */

  .review-status {
    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 10px;
    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: 0.4px;
  }

  .status-pending {
    background: #fff4d6;
    color: #856404;
  }

  .status-approved {
    background: #dff3e5;
    color: #176b3a;
  }

  .status-rejected {
    background: #fbe1e3;
    color: #8b2028;
  }


  /* =========================
     ACTION BUTTONS
     ========================= */

  .review-actions {
    display: flex;

    gap: 8px;

    margin-top: 16px;

    flex-wrap: wrap;
  }

  .approve-btn,
  .reject-btn,
  .delete-btn {
    border: none;

    padding: 9px 15px;

    border-radius: 6px;

    font-family: inherit;

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;

    transition:
      background 0.2s ease,
      transform 0.2s ease;
  }

  .approve-btn {
    background: #198754;
    color: #ffffff;
  }

  .approve-btn:hover {
    background: #157347;

    transform: translateY(-1px);
  }

  .reject-btn {
    background: #dc3545;
    color: #ffffff;
  }

  .reject-btn:hover {
    background: #bb2d3b;

    transform: translateY(-1px);
  }

  .delete-btn {
    background: #6c757d;
    color: #ffffff;
  }

  .delete-btn:hover {
    background: #495057;

    transform: translateY(-1px);
  }


  /* =========================
     EMPTY / LOADING
     ========================= */

  .empty-message {
    text-align: center;

    padding: 45px 20px;

    color: #808890;

    font-size: 13px;
  }


  /* =========================
     RESPONSIVE
     ========================= */

  @media (max-width: 900px) {

    .stats-grid {
      grid-template-columns:
        repeat(3, 1fr);
    }

    .reviews-header {
      align-items: flex-start;

      flex-direction: column;
    }

  }


  @media (max-width: 768px) {

    .admin-header {
      padding: 16px 20px;
    }

    .admin-header-inner {
      align-items: flex-start;
    }

    .admin-container {
      margin: 25px auto;

      padding: 0 16px;
    }

    .stats-grid {
      grid-template-columns: 1fr;

      gap: 12px;
    }

    .stat-card {
      padding: 18px;
    }

    .reviews-section {
      padding: 20px 16px;
    }

    .review-card-top {
      flex-direction: column;

      gap: 10px;
    }

    .review-actions {
      flex-direction: column;
    }

    .approve-btn,
    .reject-btn,
    .delete-btn {
      width: 100%;
    }

  }


  @media (max-width: 500px) {

    .admin-header-inner {
      flex-direction: column;
    }

    .admin-brand {
      width: 100%;
    }

    .logout-btn {
      width: 100%;
    }

    .admin-header h1 {
      font-size: 18px;
    }

    .dashboard-intro h2 {
      font-size: 20px;
    }

    .review-filters {
      width: 100%;
    }

    .filter-btn {
      flex: 1;
    }

  }

 </style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header class="admin-header">

  <div class="admin-header-inner">

    <div class="admin-brand">

      <div class="admin-logo">

        <img
          src="/image/logo.png"
          alt="SP Engineering & Consultancy"
        >

      </div>

      <div>

        <h1>
          Review Management
        </h1>

        <p>
          SP Engineering & Consultancy
        </p>

      </div>

    </div>


    <button
      class="logout-btn"
      id="logoutButton"
    >
      Logout
    </button>

  </div>

</header>



<!-- =========================
     MAIN
     ========================= -->

<main class="admin-container">
    <div class="dashboard-intro">

        <h2>
            Dashboard
        </h2>

        <p>
            Review and manage customer feedback submitted through the website.
        </p>

    </div>


  <!-- =========================
       STATISTICS
       ========================= -->

  <div class="stats-grid">

    <div class="stat-card pending">

      <h3>
        Pending Reviews
      </h3>

      <div
        class="stat-number"
        id="pendingCount"
      >
        0
      </div>

    </div>


    <div class="stat-card approved">

      <h3>
        Approved Reviews
      </h3>

      <div
        class="stat-number"
        id="approvedCount"
      >
        0
      </div>

    </div>


    <div class="stat-card rejected">

      <h3>
        Rejected Reviews
      </h3>

      <div
        class="stat-number"
        id="rejectedCount"
      >
        0
      </div>

    </div>

  </div>



  <!-- =========================
       REVIEW LIST
       ========================= -->

<section class="reviews-section">

    <div class="reviews-header">

        <h2>
        Customer Reviews
        </h2>

        <div class="review-filters">

        <button
            type="button"
            class="filter-btn active"
            data-filter="all"
        >
            All
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="pending"
        >
            Pending
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="approved"
        >
            Approved
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="rejected"
        >
            Rejected
        </button>

        </div>

    </div>


    <div
        id="reviewList"
        class="review-list"
    >

      <div class="empty-message">
        Loading reviews...
      </div>

    </div>

  </section>


</main>



<script>

/* =========================
   HTML ESCAPE
   ========================= */

function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}



/* =========================
   LOAD REVIEWS
   ========================= */

async function loadAdminReviews() {

  const reviewList =
    document.getElementById("reviewList");

  try {

    const response =
      await fetch("/admin/api/reviews");

    if (response.status === 401) {

      window.location.href =
        "/admin-login.html";

      return;
    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "Unable to load reviews."
      );

    }


    const reviews =
    result.reviews || [];

    const filteredReviews =
    currentReviewFilter === "all"
        ? reviews
        : reviews.filter(
            review =>
            review.status === currentReviewFilter
        );


    /* =========================
       UPDATE COUNTS
       ========================= */

    const pending =
      reviews.filter(
        review => review.status === "pending"
      ).length;

    const approved =
      reviews.filter(
        review => review.status === "approved"
      ).length;

    const rejected =
      reviews.filter(
        review => review.status === "rejected"
      ).length;


    document.getElementById(
      "pendingCount"
    ).textContent = pending;


    document.getElementById(
      "approvedCount"
    ).textContent = approved;


    document.getElementById(
      "rejectedCount"
    ).textContent = rejected;


    /* =========================
       NO REVIEWS
       ========================= */

    if (filteredReviews.length === 0) {

      reviewList.innerHTML = `
        <div class="empty-message">
          No reviews found.
        </div>
      `;

      return;
    }


    /* =========================
       CREATE REVIEW CARDS
       ========================= */

    reviewList.innerHTML = "";


    filteredReviews.forEach(review => {

      const card =
        document.createElement("article");

      card.className =
        "admin-review-card";


      const stars =
        "★".repeat(review.rating) +
        "☆".repeat(5 - review.rating);


      const date =
        new Date(
          review.createdAt
        ).toLocaleDateString(
          "en-IN",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );


      let actions = `
        <div class="review-actions">
        `;

        if (review.status === "pending") {

        actions += `

            <button
            class="approve-btn"
            onclick="updateReview(
                '${review._id}',
                'approve'
            )"
            >
            Approve
            </button>

            <button
            class="reject-btn"
            onclick="updateReview(
                '${review._id}',
                'reject'
            )"
            >
            Reject
            </button>

        `;
        }

        actions += `

            <button
            class="delete-btn"
            type="button"
            onclick="deleteReview('${String(review._id)}')"
            >
            Delete
            </button>

        </div>
        `;


      card.innerHTML = `

        <div class="review-card-top">

          <div>

            <div class="review-name">
              ${escapeHtml(review.name)}
            </div>

            <div class="review-date">
              ${date}
            </div>

          </div>


          <div class="review-stars">
            ${stars}
          </div>

        </div>


        <div class="review-feedback">
          ${escapeHtml(review.feedback)}
        </div>


        <span
          class="review-status status-${review.status}"
        >
          ${review.status}
        </span>


        ${actions}

      `;


      reviewList.appendChild(card);

    });


  } catch (error) {

    console.error(
      "Admin reviews error:",
      error
    );

    reviewList.innerHTML = `

      <div class="empty-message">

        Unable to load reviews.

      </div>

    `;

  }

}



/* =========================
   APPROVE / REJECT
   ========================= */

async function updateReview(
  reviewId,
  action
) {

  const actionName =
    action === "approve"
      ? "approve"
      : "reject";


  const confirmation =
    confirm(
      `Are you sure you want to ${actionName} this review?`
    );


  if (!confirmation) {
    return;
  }


  try {

    const response =
      await fetch(
        `/admin/api/reviews/${reviewId}/${action}`,
        {
          method: "PATCH"
        }
      );


    if (response.status === 401) {

      window.location.href =
        "/admin-login.html";

      return;
    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        `Unable to ${actionName} review.`
      );

    }


    alert(
      result.message ||
      `Review ${actionName}d successfully.`
    );


    await loadAdminReviews();


  } catch (error) {

    console.error(
      "Review update error:",
      error
    );

    alert(
      error.message ||
      "Something went wrong."
    );

  }

}



/* =========================
   LOGOUT
   ========================= */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async function() {

      try {

        await fetch(
          "/admin/logout",
          {
            method: "POST"
          }
        );

      } finally {

        window.location.href =
          "/admin-login.html";

      }

    }
  );



/* =========================
   START
   ========================= */

document.addEventListener(
  "DOMContentLoaded",
  loadAdminReviews
);
/* =========================
   REVIEW FILTERS
   ========================= */

let currentReviewFilter = "all";

document
  .querySelectorAll(".filter-btn")
  .forEach(button => {

    button.addEventListener("click", function() {

      currentReviewFilter =
        this.dataset.filter;

      document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {
          btn.classList.remove("active");
        });

      this.classList.add("active");

      loadAdminReviews();

    });

  });

async function deleteReview(reviewId) {

  console.log("Delete review ID:", reviewId);

  if (!reviewId) {
    alert("Invalid review ID.");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to permanently delete this review?\n\n" +
    "This action cannot be undone."
  );

  if (!confirmed) {
    return;
  }

  try {

    const response = await fetch(
      "/admin/api/reviews/" +
      encodeURIComponent(String(reviewId)),
      {
        method: "DELETE"
      }
    );

    console.log("Delete response status:", response.status);

    if (response.status === 401) {

      window.location.href =
        "/admin-login.html";

      return;
    }

    const result =
      await response.json();

    console.log("Delete response:", result);

    if (!response.ok || !result.success) {

      throw new Error(
        result.error ||
        "Unable to delete review."
      );
    }

    alert(
      result.message ||
      "Review deleted successfully."
    );

    await loadAdminReviews();

  } catch (error) {

    console.error(
      "Delete review error:",
      error
    );

    alert(
      "Unable to delete review.\n\n" +
      error.message
    );
  }
}
</script>
</body>
</html>
